<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="540" height="220">
  <defs>
    <!-- Luxury Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5A3"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#A8761E"/>
      <stop offset="85%" stop-color="#F9EBBE"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <radialGradient id="emblemBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D0F0A"/>
      <stop offset="70%" stop-color="#1F0604"/>
      <stop offset="100%" stop-color="#120201"/>
    </radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- LEFT CIRCULAR EMBLEM -->
    <circle cx="110" cy="110" r="96" fill="url(#goldGrad)"/>
    <circle cx="110" cy="110" r="91" fill="#120201"/>
    <circle cx="110" cy="110" r="88" fill="url(#goldGrad)"/>
    <circle cx="110" cy="110" r="84" fill="url(#emblemBg)"/>
    <circle cx="110" cy="110" r="81" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="2,2"/>

    <!-- 5 Stars -->
    <g fill="url(#goldGrad)" transform="translate(110, 42) scale(0.75)">
      <polygon points="0,-10 3,-3 10,-3 4,1 6,8 0,4 -6,8 -4,1 -10,-3 -3,-3"/>
      <polygon points="-16,-6 -13,0 -6,0 -11,4 -9,11 -16,7 -23,11 -21,4 -26,0 -19,0"/>
      <polygon points="-30,-1 -28,4 -22,4 -26,8 -25,14 -30,11 -35,14 -34,8 -38,4 -32,4"/>
      <polygon points="16,-6 13,0 6,0 11,4 9,11 16,7 23,11 21,4 26,0 19,0"/>
      <polygon points="30,-1 28,4 22,4 26,8 25,14 30,11 35,14 34,8 38,4 32,4"/>
    </g>

    <!-- Buildings Outline -->
    <g fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.95">
      <rect x="62" y="70" width="20" height="42" rx="1"/>
      <line x1="67" y1="77" x2="72" y2="77"/><line x1="67" y1="84" x2="72" y2="84"/><line x1="67" y1="91" x2="72" y2="91"/><line x1="67" y1="98" x2="72" y2="98"/>

      <rect x="86" y="58" width="48" height="54" rx="1"/>
      <line x1="93" y1="65" x2="99" y2="65"/><line x1="104" y1="65" x2="110" y2="65"/><line x1="115" y1="65" x2="121" y2="65"/>
      <line x1="93" y1="73" x2="99" y2="73"/><line x1="104" y1="73" x2="110" y2="73"/><line x1="115" y1="73" x2="121" y2="73"/>
      <line x1="93" y1="81" x2="99" y2="81"/><line x1="104" y1="81" x2="110" y2="81"/><line x1="115" y1="81" x2="121" y2="81"/>
      <line x1="93" y1="89" x2="99" y2="89"/><line x1="104" y1="89" x2="110" y2="89"/><line x1="115" y1="89" x2="121" y2="89"/>

      <rect x="138" y="70" width="20" height="42" rx="1"/>
      <line x1="143" y1="77" x2="148" y2="77"/><line x1="143" y1="84" x2="148" y2="84"/><line x1="143" y1="91" x2="148" y2="91"/><line x1="143" y1="98" x2="148" y2="98"/>
    </g>

    <!-- Cloche Dome -->
    <path d="M 60 125 C 60 98, 82 92, 110 92 C 138 92, 160 98, 160 125 Z" fill="url(#goldGrad)"/>
    <rect x="52" y="124" width="116" height="7" rx="3.5" fill="url(#goldGrad)"/>
    <circle cx="110" cy="90" r="6" fill="url(#goldGrad)"/>
    <path d="M 48 132 C 48 132, 110 140, 172 132 C 165 142, 130 146, 110 146 C 90 146, 55 142, 48 132 Z" fill="url(#goldGrad)"/>

    <!-- Fork & Spoon -->
    <g fill="url(#goldGrad)" transform="translate(54, 82)">
      <path d="M 0 0 L 2 0 L 2 14 L 0 14 Z M 5 0 L 7 0 L 7 14 L 5 14 Z M 10 0 L 12 0 L 12 14 L 10 14 Z"/>
      <path d="M 0 12 C 0 20, 12 20, 12 12 L 8 26 L 8 50 L 4 50 L 4 26 Z"/>
    </g>
    <g fill="url(#goldGrad)" transform="translate(152, 82)">
      <path d="M 6 0 C 0 0, 0 20, 6 20 C 12 20, 12 0, 6 0 Z"/>
      <rect x="5" y="18" width="3" height="34" rx="1.5"/>
    </g>

    <!-- Flourish under Emblem -->
    <path d="M 90 166 C 102 161, 118 161, 130 166 M 100 169 C 110 173, 120 169, 120 169" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="110" cy="164" r="2.5" fill="url(#goldGrad)"/>

    <!-- RIGHT SIDE: STACKED TYPOGRAPHY -->
    <!-- Top Divider Line with Fleur-de-lis -->
    <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round">
      <line x1="240" y1="46" x2="365" y2="46"/>
      <line x1="415" y1="46" x2="520" y2="46"/>
      <circle cx="240" cy="46" r="3.5" fill="url(#goldGrad)"/>
      <circle cx="520" cy="46" r="3.5" fill="url(#goldGrad)"/>
    </g>
    <g fill="url(#goldGrad)" transform="translate(390, 46)">
      <path d="M 0 -8 C 6 -4, 6 0, 0 4 C -6 0, -6 -4, 0 -8 Z"/>
      <path d="M -8 -2 C -2 -4, 0 2, -8 4 Z"/>
      <path d="M 8 -2 C 2 -4, 0 2, 8 4 Z"/>
    </g>

    <!-- DESI -->
    <text x="238" y="94" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="52" font-weight="800" fill="url(#goldGrad)" letter-spacing="3">
      DESI
    </text>

    <!-- DELIGHT with flourish swirl -->
    <text x="238" y="146" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="52" font-weight="800" fill="url(#goldGrad)" letter-spacing="2">
      DELIGHT
    </text>

    <!-- Subtitle: HOTELS & RESTAURANT -->
    <text x="254" y="176" font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', sans-serif" font-size="16" font-weight="700" fill="url(#goldGrad)" letter-spacing="4.5">
      HOTELS &amp; RESTAURANT
    </text>

    <!-- Bottom Divider Line with Fleur-de-lis -->
    <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round">
      <line x1="240" y1="192" x2="365" y2="192"/>
      <line x1="415" y1="192" x2="520" y2="192"/>
      <circle cx="240" cy="192" r="3.5" fill="url(#goldGrad)"/>
      <circle cx="520" cy="192" r="3.5" fill="url(#goldGrad)"/>
    </g>
    <g fill="url(#goldGrad)" transform="translate(390, 192)">
      <path d="M 0 8 C 6 4, 6 0, 0 -4 C -6 0, -6 4, 0 8 Z"/>
      <path d="M -8 2 C -2 4, 0 -2, -8 -4 Z"/>
      <path d="M 8 2 C 2 4, 0 -2, 8 -4 Z"/>
    </g>
  </g>
</svg>
